name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # core has to build first: every other package resolves
      # @context-health/core's types and runtime code from its dist/ output.
      - name: Build core
        run: npm run build -w @context-health/core

      - name: Test core
        run: npm test -w @context-health/core

      - name: Run core evals
        run: npm run eval -w @context-health/core

      - name: Typecheck all packages
        run: npm run typecheck --workspaces --if-present

      - name: Build web-demo
        run: npm run build -w @context-health/web-demo

      - name: Build extension
        run: npm run build -w @context-health/extension

      - name: Build mcp-server
        run: npm run build -w @context-health/mcp-server
